$kind: http-request
name: POST Login - Missing Fields
url: "{{baseUrl}}/auth"
method: POST
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      const tc = {\r

      \    id: pm.iterationData.get(\"testCaseId\"),\r

      \    scenario: pm.iterationData.get(\"scenario\")\r

      };\r

      \r

      pm.test(`[${tc.id}] ${tc.scenario} - Status is 200`, () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(`[${tc.id}] ${tc.scenario} - Response should contain 'reason' property`, () => {\r

      \    pm.expect(response).to.have.property(\"reason\");\r

      });\r

      \r

      pm.test(`[${tc.id}] ${tc.scenario} - Reason should be 'Bad credentials'`, () => {\r

      \    pm.expect(response.reason).to.eql(\"Bad credentials\");\r

      });\r

      \r

      pm.test(`[${tc.id}] ${tc.scenario} - Response should not contain authentication token`, () => {\r

      \    pm.expect(response).to.not.have.property(\"token\");\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const body = {};\r

      \r

      const includeUsername = pm.iterationData.get(\"includeUsername\");\r

      const includePassword = pm.iterationData.get(\"includePassword\");\r

      \r

      if (includeUsername) {\r

      \    body.username = pm.environment.get(\"username\");\r

      }\r

      \r

      if (includePassword) {\r

      \    body.password = pm.environment.get(\"password\");\r

      }\r

      \r

      pm.request.body.update(JSON.stringify(body));"
    language: text/javascript
order: 5000
