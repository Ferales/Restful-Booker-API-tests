$kind: http-request
name: POST Login - Valid Credentials
url: "{{baseUrl}}/auth"
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"{{username}}\",\r

    \    \"password\": \"{{password}}\"\r

    }"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Status is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      })\r

      \r

      pm.test(\"Token exists\", () => {\r

      \    pm.expect(response.token).to.exist;\r

      });\r

      \r

      pm.test(\"Token is a string\", () => {\r

      \    pm.expect(response.token).to.be.a('string');\r

      });\r

      \r

      pm.test(\"Token is not empty\", () => {\r

      \    pm.expect(response.token).to.not.be.empty;\r

      });"
    language: text/javascript
order: 1000
