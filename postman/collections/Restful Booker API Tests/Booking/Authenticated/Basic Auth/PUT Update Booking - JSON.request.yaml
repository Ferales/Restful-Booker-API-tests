$kind: http-request
name: PUT Update Booking - JSON
description: ""
url: "{{baseUrl}}/booking/{{validId2}}"
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"Test\",\r

    \    \"lastname\" : \"Api\",\r

    \    \"totalprice\" : 512,\r

    \    \"depositpaid\" : false,\r

    \    \"bookingdates\" : {\r

    \        \"checkin\" : \"2026-07-18\",\r

    \        \"checkout\" : \"2026-08-01\"\r

    \    },\r

    \    \"additionalneeds\" : \"Extra meal\"\r

    }"
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      const expectedData = JSON.parse(pm.request.body.raw);\r

      \r

      pm.test(\"Status is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response should be JSON\", () => {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Response booking should be equal to request booking\", () => {\r

      \    pm.expect(response).to.deep.equal(expectedData);\r

      });\r\n"
    language: text/javascript
order: 2981791629037292
