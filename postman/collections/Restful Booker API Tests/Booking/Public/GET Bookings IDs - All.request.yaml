$kind: http-request
name: GET Bookings IDs - All
url: "{{baseUrl}}/booking"
method: GET
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      pm.test(\"Status is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      })\r

      \r

      pm.test(\"Response should be an array\", () => {\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Response should not be empty\", () => {\r

      \    pm.expect(response.length).to.be.above(0);\r

      });\r

      \r

      pm.test(\"Each booking should contain numeric bookingid\", () => {\r

      \    response.forEach(item => {\r

      \        pm.expect(item).to.have.property(\"bookingid\");\r

      \        pm.expect(item.bookingid).to.be.a(\"number\");\r

      \        pm.expect(item.bookingid).to.be.above(0);\r

      \    });\r

      });\r

      \r

      pm.test(\"Each bookingid should be a positive number\", () => {\r

      \    response.forEach(item => {\r

      \        pm.expect(item.bookingid).to.be.a(\"number\");\r

      \        pm.expect(item.bookingid).to.be.above(0);\r

      \    });\r

      });\r

      \r

      pm.test(\"Booking IDs should be unique\", () => {\r

      \    const ids = response.map(item => item.bookingid);\r

      \    const uniqueIds = new Set(ids);\r

      \r

      \    pm.expect(uniqueIds.size).to.eql(ids.length);\r

      });\r

      \r

      pm.collectionVariables.set(\"validId\", response[10].bookingid)\r

      pm.collectionVariables.set(\"validId2\", response[12].bookingid)"
    language: text/javascript
order: 1784386111604
