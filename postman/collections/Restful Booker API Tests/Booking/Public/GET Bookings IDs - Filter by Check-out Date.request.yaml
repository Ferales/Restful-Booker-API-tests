$kind: http-request
name: GET Bookings IDs - Filter by Check-out Date
url: "{{baseUrl}}/booking?checkout=2019-01-01"
method: GET
queryParams:
  checkout: 2019-01-01
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      \r

      const expectedCheckoutDate = new Date(pm.request.url.query.get(\"checkout\"));\r

      const baseUrl = pm.environment.get(\"baseUrl\");\r

      \r

      const sampleSize = Math.min(response.length, 10);\r

      \r

      const bookingsToValidate = [...response]\r

      \    .sort(() => Math.random() - 0.5)\r

      \    .slice(0, sampleSize);\r

      \r

      pm.test(\"Status is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      })\r

      \r

      pm.test(\"Response should be an array\", () => {\r

      \    pm.expect(response).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Response should not be empty\", () => {\r

      \    pm.expect(response.length).to.be.above(0);\r

      });\r

      \r

      pm.test(\"Each booking should contain numeric bookingid\", () => {\r

      \    response.forEach(item => {\r

      \        pm.expect(item).to.have.property(\"bookingid\");\r

      \        pm.expect(item.bookingid).to.be.a(\"number\");\r

      \        pm.expect(item.bookingid).to.be.above(0);\r

      \    });\r

      });\r

      \r

      pm.test(\"Each bookingid should be a positive number\", () => {\r

      \    response.forEach(item => {\r

      \        pm.expect(item.bookingid).to.be.a(\"number\");\r

      \        pm.expect(item.bookingid).to.be.above(0);\r

      \    });\r

      });\r

      \r

      pm.test(\"Booking IDs should be unique\", () => {\r

      \    const ids = response.map(item => item.bookingid);\r

      \    const uniqueIds = new Set(ids);\r

      \r

      \    pm.expect(uniqueIds.size).to.eql(ids.length);\r

      });\r

      \r

      bookingsToValidate.forEach(item => {\r

      \r

      \    pm.sendRequest(`${baseUrl}/booking/${item.bookingid}`, (err, res) => {\r

      \r

      \        pm.test(`Booking ${item.bookingid} should exist`, () => {\r

      \            pm.expect(err).to.be.null;\r

      \            pm.expect(res.code).to.eql(200);\r

      \        });\r

      \r

      \        pm.test(`Booking ${item.bookingid} should satisfy check-out filter`, () => {\r

      \r

      \            const booking = res.json();\r

      \r

      \            const checkoutDate = new Date(booking.bookingdates.checkout);\r

      \r

      \            pm.expect(checkoutDate).to.lessThanOrEqual(expectedCheckoutDate);\r

      \r

      \        });\r

      \r

      \    });\r

      \r

      });"
    language: text/javascript
order: 4485362932409499
