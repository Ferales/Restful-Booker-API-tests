$kind: http-request
name: POST Create Booking - XML
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: text/xml
body:
  type: json
  content: " <booking>\r

    \     <firstname>Test</firstname>\r

    \     <lastname>Api</lastname>\r

    \     <totalprice>512</totalprice>\r

    \     <depositpaid>true</depositpaid>\r

    \     <bookingdates>\r

    \         <checkin>2026-07-18</checkin>\r

    \         <checkout>2026-08-01</checkout>\r

    \     </bookingdates>\r

    \     <additionalneeds>Extra meal</additionalneeds>\r

    \ </booking>"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "const response = pm.response.json();\r

      const expectedData = xml2Json(pm.request.body.raw).booking;\r

      \r

      //expectedData after parsing from xml to json have all fields as strings, so we need to convert them to correct types before comparison\r

      expectedData.totalprice = Number(expectedData.totalprice);\r

      expectedData.depositpaid = expectedData.depositpaid === \"true\";\r

      \r

      pm.test(\"Status is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response should be JSON\", () => {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Response booking should be equal to request booking\", () => {\r

      \    pm.expect(response.booking).to.deep.equal(expectedData);\r

      });\r

      \r

      pm.test(\"Response should contain valid bookingid\", () => {\r

      \    pm.expect(response).to.have.property(\"bookingid\");\r

      \    pm.expect(response.bookingid).to.be.a(\"number\");\r

      \    pm.expect(response.bookingid).to.be.above(0);\r

      });"
    language: text/javascript
